<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aeri 历史记录</title>
<style>
:root{
  --bg:#f6f7fb;--panel:#ffffff;--ink:#111827;--ink2:#374151;--ink3:#6b7280;--ink4:#9ca3af;
  --line:#e8eaf0;--hover:#f1f2f7;--accent:#4f46e5;--accent-soft:#eef0ff;--user:#eef0ff;--user-ink:#3730a3;
  --ok:#15803d;--ok-soft:#e8f6ee;--bad:#b91c1c;--bad-soft:#fdeceb;--warn:#b45309;--warn-soft:#fdf3e4;
  --mark:#fde68a;--radius:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1017;--panel:#161925;--ink:#f3f4f6;--ink2:#d1d5db;--ink3:#9ca3af;--ink4:#6b7280;
  --line:#252a39;--hover:#1d2130;--accent:#8b93ff;--accent-soft:#232647;--user:#232647;--user-ink:#c7cbff;
  --ok:#4ade80;--ok-soft:#14261c;--bad:#f87171;--bad-soft:#2a1617;--warn:#fbbf24;--warn-soft:#2a2112;--mark:#6b5a12;
}}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.65 "Segoe UI Variable Text","Microsoft YaHei UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1080px;margin:0 auto;min-height:100vh}
/* 左侧日期 */
aside{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:28px 12px 28px 20px}
.brand{font-size:17px;font-weight:650;letter-spacing:-.01em;margin:0 8px 4px}
.stats{color:var(--ink3);font-size:12px;margin:0 8px 18px}
.days{list-style:none;margin:0;padding:0}
.days a{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:9px;color:var(--ink2);text-decoration:none;font-size:13.5px}
.days a:hover{background:var(--hover)}
.days a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.days small{color:var(--ink4);font-size:12px;font-variant-numeric:tabular-nums}
/* 顶部工具栏 */
main{min-width:0;padding:0 28px 80px}
.bar{position:sticky;top:0;z-index:2;background:linear-gradient(var(--bg) 82%,transparent);padding:24px 0 14px}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink4)}
.search input{width:100%;padding:11px 44px 11px 38px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:12px/1 ui-monospace,monospace;color:var(--ink4);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.filters{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 12px;font-size:13px;color:var(--ink2)}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.count{margin-left:auto;color:var(--ink3);font-size:12.5px}
/* 日期段 */
.day{margin-top:18px}
.day h2{display:flex;align-items:baseline;gap:10px;font-size:15px;font-weight:650;margin:0 0 6px}
.day h2 span{color:var(--ink4);font-size:12.5px;font-weight:400}
.session{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px 10px;margin:12px 0}
.stime{color:var(--ink4);font-size:12px;margin-bottom:6px;font-variant-numeric:tabular-nums}
/* 对话 */
.row{display:flex;margin:8px 0}
.row.u{justify-content:flex-end}
.bubble{max-width:78%;white-space:pre-wrap;word-break:break-word}
.u .bubble{background:var(--user);color:var(--user-ink);padding:8px 13px;border-radius:14px 14px 4px 14px}
.a{gap:10px}
.a .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:9px;opacity:.75}
.a .bubble{max-width:88%;color:var(--ink)}
.msg-tools{display:none;gap:4px;margin-left:8px;vertical-align:middle}
.row:hover .msg-tools{display:inline-flex}
.icon-btn{border:0;background:transparent;color:var(--ink4);padding:2px 6px;border-radius:6px;font-size:12px}
.icon-btn:hover{background:var(--hover);color:var(--ink2)}
.sys{text-align:center;color:var(--ink4);font-size:12.5px;margin:8px 0}
.tools{margin:4px 0 4px 18px}
.tools summary{list-style:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink3);font-size:12.5px;padding:2px 8px;border-radius:7px;background:var(--hover);cursor:pointer;user-select:none}
.tools summary::-webkit-details-marker{display:none}
.tools summary::before{content:"";width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.tools[open] summary::before{transform:rotate(45deg)}
.tools ul{margin:6px 0 2px;padding-left:18px;color:var(--ink3);font-size:12.5px}
/* 任务卡片 */
.task{border:1px solid var(--line);border-left:3px solid var(--ink4);border-radius:10px;padding:10px 14px;margin:10px 0;background:var(--bg)}
.task.done{border-left-color:var(--ok)}.task.failed{border-left-color:var(--bad)}.task.cancelled{border-left-color:var(--warn)}
.task .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.task .head b{font-weight:600}
.tag{font-size:11.5px;padding:1px 8px;border-radius:99px;font-weight:600}
.tag.done{background:var(--ok-soft);color:var(--ok)}.tag.failed{background:var(--bad-soft);color:var(--bad)}.tag.cancelled{background:var(--warn-soft);color:var(--warn)}
.task .meta{color:var(--ink3);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums}
.task .desc{margin-top:6px;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.task details{margin-top:8px}
.task details summary{color:var(--accent);font-size:13px;cursor:pointer}
.task .result{position:relative;margin-top:6px;padding:10px 12px;background:var(--panel);border-radius:8px;white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.task .result .icon-btn{position:absolute;top:6px;right:6px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--ink3);padding:90px 0}
.empty b{display:block;color:var(--ink2);font-size:16px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:99px;font-size:13px;transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;padding:20px 16px 0}
  .days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .days a{white-space:nowrap;border:1px solid var(--line)}
  .days small{display:none}
  main{padding:0 16px 60px}
  .bubble{max-width:92%}
  .msg-tools{display:inline-flex}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">历史记录</div>
    <div class="stats" id="stats"></div>
    <ul class="days" id="days"></ul>
  </aside>
  <main>
    <div class="bar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" placeholder="搜索对话和任务" autocomplete="off">
        <kbd>/</kbd>
      </div>
      <div class="filters" id="filters">
        <button class="chip on" data-f="all">全部</button>
        <button class="chip" data-f="chat">对话</button>
        <button class="chip" data-f="task">任务</button>
        <button class="chip" data-f="failed">失败的任务</button>
        <span class="count" id="count"></span>
      </div>
    </div>
    <div id="list"></div>
  </main>
</div>
<div class="toast" id="toast">已复制</div>
<script>
const DATA = __DATA__;
const SESSION_GAP_MIN = 10;
const STATE = {done: "已完成", failed: "失败", cancelled: "已取消", running: "进行中"};
const WEEK = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
let filter = "all";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function hl(s, q) {
  s = esc(s);
  return q ? s.replace(new RegExp(reEsc(esc(q)), "gi"), m => "<mark>" + m + "</mark>") : s;
}
function dayLabel(day) {
  const d = new Date(day + "T00:00:00"), today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - d) / 86400000);
  if (diff === 0) return "今天";
  if (diff === 1) return "昨天";
  if (diff < 7) return WEEK[d.getDay()];
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}
const minutes = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
function duration(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return m ? `${m} 分 ${s} 秒` : `${s} 秒`;
}
function hay(e) { return (e.text + " " + (e.task ? e.task.description + " " + e.task.result : "")).toLowerCase(); }
function keep(e, q) {
  if (filter === "chat" && e.kind !== "chat") return false;
  if (filter === "task" && e.kind !== "task") return false;
  if (filter === "failed" && !(e.kind === "task" && e.task.state === "failed")) return false;
  // 任务的“已完成”通知和工具调用在只看任务时不显示
  return !q || hay(e).includes(q.toLowerCase());
}

/* 一天的条目切成会话：间隔超过 10 分钟算新的一段 */
function sessions(items) {
  const out = [];
  let cur = null, last = -1;
  for (const e of items) {
    const m = minutes(e.t);
    if (!cur || m - last > SESSION_GAP_MIN) { cur = {start: e.t, items: []}; out.push(cur); }
    cur.items.push(e);
    last = m;
  }
  return out;
}

function renderItems(items, q) {
  let html = "", tools = [];
  const flush = () => {
    if (!tools.length) return;
    const n = tools.length;
    html += `<details class="tools"${q && tools.some(t => t.toLowerCase().includes(q.toLowerCase())) ? " open" : ""}><summary>${n === 1 ? esc(tools[0]) : `用了 ${n} 个工具`}</summary>${n > 1 ? "<ul>" + tools.map(t => `<li>${hl(t, q)}</li>`).join("") + "</ul>" : ""}</details>`;
    tools = [];
  };
  for (const e of items) {
    if (e.kind === "chat" && e.role === 2) { tools.push(e.text); continue; }
    flush();
    if (e.kind === "task") {
      const t = e.task;
      html += `<div class="task ${t.state}"><div class="head"><b>任务 #${t.id}</b><span class="tag ${t.state}">${STATE[t.state] || t.state}</span><span class="meta">${e.t.slice(0, 5)} · ${esc(t.executor)} · ${duration(t.secs)}</span></div>
        <div class="desc">${hl(t.description, q)}</div>
        ${t.result ? `<details${q && t.result.toLowerCase().includes(q.toLowerCase()) ? " open" : ""}><summary>查看结果</summary><div class="result"><button class="icon-btn" data-copy>复制</button><span>${hl(t.result, q)}</span></div></details>` : ""}</div>`;
    } else if (e.role === 0) {
      html += `<div class="row u"><div class="bubble">${hl(e.text, q)}</div></div>`;
    } else if (e.role === 3) {
      html += `<div class="sys">${hl(e.text, q)}</div>`;
    } else {
      html += `<div class="row a"><span class="dot"></span><div class="bubble"><span>${hl(e.text, q)}</span><span class="msg-tools"><button class="icon-btn" data-copy>复制</button></span></div></div>`;
    }
  }
  flush();
  return html;
}

function render() {
  const q = $("q").value.trim();
  let html = "", shown = 0, nav = "";
  for (const d of DATA) {
    const items = d.items.filter(e => keep(e, q));
    if (!items.length) continue;
    shown += items.filter(e => !(e.kind === "chat" && e.role === 2)).length;
    const id = "d" + d.day;
    nav += `<li><a href="#${id}" data-day="${id}">${dayLabel(d.day)}<small>${items.length}</small></a></li>`;
    html += `<section class="day" id="${id}"><h2>${dayLabel(d.day)}<span>${d.day}</span></h2>`;
    for (const s of sessions(items)) {
      html += `<div class="session"><div class="stime">${s.start.slice(0, 5)}</div>${renderItems(s.items, q)}</div>`;
    }
    html += `</section>`;
  }
  $("days").innerHTML = nav;
  $("count").textContent = q || filter !== "all" ? `找到 ${shown} 条` : "";
  $("list").innerHTML = html || (DATA.length
    ? `<div class="empty"><b>没有找到</b>换个关键词，或者切回“全部”试试</div>`
    : `<div class="empty"><b>还没有记录</b>和 Aeri 说过的话、交给它的任务会保存在这里，保留 30 天</div>`);
  spy();
}

function stats() {
  let chats = 0, tasks = 0;
  for (const d of DATA) for (const e of d.items) {
    if (e.kind === "task") tasks++;
    else if (e.role === 0) chats++;
  }
  $("stats").textContent = DATA.length ? `${DATA.length} 天 · ${chats} 句话 · ${tasks} 个任务` : "";
}

/* 滚动时高亮左侧对应的日期 */
function spy() {
  const links = [...document.querySelectorAll(".days a")];
  let current = links[0];
  for (const a of links) {
    const sec = document.getElementById(a.dataset.day);
    if (sec && sec.getBoundingClientRect().top < 140) current = a;
  }
  links.forEach(a => a.classList.toggle("on", a === current));
}

function toast() {
  const t = $("toast");
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 1200);
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  const text = b.closest(".result, .bubble").querySelector("span").innerText;
  navigator.clipboard.writeText(text).then(toast, () => {});
});
$("q").addEventListener("input", render);
$("filters").addEventListener("click", e => {
  const b = e.target.closest("[data-f]");
  if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll("[data-f]").forEach(x => x.classList.toggle("on", x === b));
  render();
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape" && document.activeElement === $("q")) { $("q").value = ""; render(); $("q").blur(); }
});
window.addEventListener("scroll", spy, {passive: true});
stats();
render();
</script>
</body>
</html>
